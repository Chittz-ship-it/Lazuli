<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lazuli Industries - Internal Communications</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --void:#04070c;
  --glass:#0a1424;
  --panel:#0e1b30;
  --lapis:#2a5fb0;
  --lapis-deep:#17356b;
  --phos:#aecdf0;
  --dim:#5f7896;
  --unread:#6ea2ff;
  --red:#c2372e;
  --mono:"IBM Plex Mono",ui-monospace,"Courier New",monospace;
  --term:"VT323","IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#000;color:var(--phos);font-family:var(--mono);-webkit-tap-highlight-color:transparent}
body{display:flex;justify-content:center;align-items:center}

#crt{
  position:relative;width:100%;max-width:1000px;
  height:100vh;height:100dvh;
  background:var(--void);overflow:hidden;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
}
@media (min-width:900px) and (min-height:720px){
  #crt{height:min(100dvh,780px);border:12px solid #10151d;border-radius:26px;box-shadow:0 0 80px rgba(42,95,176,.18)}
}
#screen{
  height:100%;display:flex;flex-direction:column;
  text-shadow:0 0 6px rgba(140,190,255,.35);
  transition:filter 6s ease-in;
}
#crt.dimming #screen{filter:brightness(.35) contrast(1.15)}
#crt.glitch #screen{transform:translateX(3px) skewX(-1.2deg);filter:hue-rotate(-25deg) saturate(1.5);text-shadow:-2px 0 rgba(255,60,60,.7),2px 0 rgba(60,160,255,.7)}

/* CRT overlays */
.scan{position:absolute;inset:0;pointer-events:none;z-index:20;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.24) 3px);
  animation:flick 7s infinite steps(1)}
.roll{position:absolute;left:0;right:0;top:-120px;height:110px;pointer-events:none;z-index:19;
  background:linear-gradient(to bottom,transparent,rgba(120,170,255,.05),transparent);animation:roll 11s linear infinite}
.vig{position:absolute;inset:0;pointer-events:none;z-index:21;
  background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.7) 100%)}
@keyframes flick{0%{opacity:1}91%{opacity:1}92%{opacity:.8}93%{opacity:1}96%{opacity:.9}97%{opacity:1}}
@keyframes roll{from{transform:translateY(0)}to{transform:translateY(calc(100vh + 240px))}}
#blackout{position:absolute;inset:0;background:#000;z-index:30;display:none}

/* Boot */
#boot{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px;min-height:0;overflow:auto}
.gem{width:52px;height:52px;margin-bottom:18px;
  background:conic-gradient(from 30deg,#1b3f8b,#5b8ee0,#0f2a5c,#3c73c9,#1b3f8b);
  clip-path:polygon(50% 0,100% 38%,50% 100%,0 38%)}
#boot h1{font-family:var(--term);font-weight:400;font-size:clamp(44px,12vw,64px);letter-spacing:.06em;margin:0;line-height:1}
.sub{font-family:var(--term);font-size:26px;color:var(--dim);margin:6px 0 30px}
.warn{font-size:13px;line-height:1.6;color:var(--dim);max-width:34ch;margin:0 0 22px}
.btn{font-family:var(--term);font-size:26px;color:var(--phos);background:var(--lapis-deep);border:1px solid var(--lapis);
  padding:8px 20px;cursor:pointer;text-shadow:inherit}
.btn:hover{background:var(--lapis)}
.btn:focus-visible,.row:focus-visible,.file:focus-visible,.tbtn:focus-visible{outline:2px solid #cfe2ff;outline-offset:2px}
#bootlog{font-family:var(--term);font-size:24px;line-height:1.35;margin-top:8px}
#bootlog div.warnline{color:#e6867f}

/* Mail */
#mail{flex:1;display:none;flex-direction:column;min-height:0}
.topbar{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--lapis-deep)}
.topbar .gem{width:22px;height:22px;margin:0}
.brand{font-family:var(--term);font-size:26px;letter-spacing:.04em;flex:1;white-space:nowrap}
.tbtn{white-space:nowrap;font-family:var(--term);font-size:20px;color:var(--phos);background:transparent;border:1px solid var(--lapis-deep);padding:2px 10px;cursor:pointer;text-shadow:inherit}
.statusbar{display:flex;justify-content:space-between;padding:4px 14px;font-size:12px;color:var(--dim);border-bottom:1px solid var(--lapis-deep);background:var(--glass)}
.statusbar .alert{color:#e6867f}

.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(250px,320px) 1fr;position:relative;background:var(--glass)}
.list{overflow:auto;min-height:0;border-right:1px solid var(--lapis-deep)}
.row{display:grid;grid-template-columns:16px 1fr auto;grid-template-areas:"dot subj clip" "dot meta clip";column-gap:8px;
  width:100%;text-align:left;font:inherit;color:inherit;text-shadow:inherit;background:transparent;border:0;border-bottom:1px solid rgba(23,53,107,.6);padding:12px 14px;cursor:pointer}
.row:hover{background:rgba(42,95,176,.14)}
.row.sel{background:rgba(42,95,176,.26)}
.row .dot{grid-area:dot;align-self:center;width:8px;height:8px;border-radius:50%;background:transparent;border:1px solid var(--dim)}
.row.unread .dot{background:var(--unread);border-color:var(--unread);box-shadow:0 0 8px var(--unread)}
.row .subj{grid-area:subj;font-size:15px}
.row.unread .subj{font-weight:500;color:#dcebff}
.row .meta{grid-area:meta;font-size:12px;color:var(--dim)}
.row .clip{grid-area:clip;align-self:center;font-size:12px;color:var(--dim);border:1px solid var(--lapis-deep);padding:0 6px}
.row.last.unread .dot{background:var(--red);border-color:var(--red);box-shadow:0 0 10px var(--red)}
.wait{padding:16px 14px;font-size:13px;color:var(--dim)}
.wait::after{content:"_";animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.reader{display:flex;flex-direction:column;min-height:0;min-width:0}
.rempty{margin:auto;color:var(--dim);font-size:14px;padding:20px;text-align:center}
.rview{display:flex;flex-direction:column;min-height:0;flex:1}
.rhead{padding:12px 16px 10px;border-bottom:1px solid var(--lapis-deep)}
.rhead .back{display:none;margin-bottom:8px}
.rhead h2{font-family:var(--term);font-weight:400;font-size:32px;line-height:1.05;margin:0 0 6px}
.rhead dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:12px;color:var(--dim)}
.rhead dt{color:var(--dim)}
.rhead dd{margin:0;color:var(--phos)}
.rscroll{flex:1;min-height:0;overflow:auto;padding:16px 16px 40px}
.rbody{font-size:15px;line-height:1.6;white-space:pre-wrap;max-width:68ch;overflow-wrap:anywhere}
.rbody.hunger{font-family:var(--term);font-size:clamp(44px,14vw,96px);line-height:1.7;padding:36px 0;text-align:center;max-width:none;
  color:#f2c4c0;text-shadow:0 0 14px rgba(220,60,50,.65);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.files{margin-top:22px;max-width:68ch}
.file{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;font:inherit;font-size:13px;color:var(--phos);text-shadow:inherit;
  background:var(--panel);border:1px solid var(--lapis-deep);padding:10px 12px;margin-top:8px;cursor:pointer}
.file:hover{border-color:var(--lapis)}
.file .tag{color:var(--unread)}
.file.done{opacity:.6}
.file.done .tag{color:var(--dim)}

.doc{position:absolute;inset:0;background:var(--glass);display:flex;flex-direction:column;z-index:5;min-height:0}
.dbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 14px;background:var(--lapis-deep);font-size:13px}
.dscroll{flex:1;min-height:0;overflow:auto;padding:16px 16px 40px}
.dscroll h3{font-family:var(--term);font-weight:400;font-size:30px;line-height:1.05;margin:0 0 4px}
#ddate{font-size:12px;color:var(--dim);margin-bottom:14px}
#dbody{font-size:15px;line-height:1.6;white-space:pre-wrap;max-width:68ch;overflow-wrap:anywhere}

#toast{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 80px);z-index:15;cursor:pointer;
  background:var(--lapis);color:#fff;padding:10px 14px;font-size:14px;border:1px solid #7fb0ff;box-shadow:0 0 20px rgba(42,95,176,.6)}
#toast strong{font-family:var(--term);font-weight:400;font-size:22px;margin-right:6px}

.ant{position:absolute;left:0;bottom:calc(6px + env(safe-area-inset-bottom));z-index:12;font-size:14px;opacity:.85;pointer-events:none;
  animation:crawl 10s linear forwards}
@keyframes crawl{from{transform:translateX(-30px) rotate(90deg)}to{transform:translateX(100vw) rotate(90deg)}}

@media (max-width:719px){
  .body{grid-template-columns:1fr}
  .reader{display:none}
  .body.show-reader .list{display:none}
  .body.show-reader .reader{display:flex}
  .list{border-right:0}
  .rhead .back{display:inline-block}
}

/* Scare + ending */
#scare{position:fixed;inset:0;width:100%;height:100%;z-index:100;display:none;background:#000}
#end{position:fixed;inset:0;z-index:110;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;
  color:var(--phos);font-family:var(--term);text-align:center;padding:24px}
#end .line{font-size:34px;opacity:0;transition:opacity 2.2s}
#end .line.on{opacity:1}
.card{width:132px;height:192px;perspective:900px;margin:30px auto 18px;cursor:pointer;opacity:0;transition:opacity 2s;background:none;border:0;padding:0}
.card.on{opacity:1}
.card .in{position:relative;width:100%;height:100%;transition:transform 1s;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.card .back,.card .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px}
.card .back{background:repeating-linear-gradient(45deg,#17356b 0 3px,#1f4a94 3px 9px);border:7px solid #d8b45a;box-shadow:inset 0 0 0 2px #17356b}
.card .face{transform:rotateY(180deg);background:#efe8d8;color:#8b1a1a;font-family:Georgia,serif;border:1px solid #cfc6b0}
.card .face .c1,.card .face .c2{position:absolute;font-size:22px;line-height:1;text-align:center}
.card .face .c1{top:8px;left:9px}
.card .face .c2{bottom:8px;right:9px;transform:rotate(180deg)}
.card .face .mid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:70px}
#end .after{font-size:30px;opacity:0;transition:opacity 2s;min-height:36px}
#end .after.on{opacity:1}
#again{margin-top:26px;opacity:0;transition:opacity 2s}
#again.on{opacity:1}

@media (prefers-reduced-motion:reduce){
  .scan,.roll,.rbody.hunger,.wait::after{animation:none}
  #screen{transition:none}
}
</style>
</head>

    <div id="mail">

</div>

<canvas id="scare"></canvas>
<div id="end">

</div>

  body: `It's beyond frustrating. I'm no closer to finding out what Lazuli does. I've exhausted all avenues. Trying to trace Mark and having all ancestry sites either give up or glitch out by claiming he's related to people he couldn't possibly be. I kept the bottle so I ran it by some expensive DNA site, Mark is a ghost. And Mark's second name? Anyone? And the million dollar question, where or who is Thomas Lazuli? The red room was open again today but I didn't get a chance to go near it. Helen was in there. Walked in with what looked like an coloured ice cube on a tray. Silicon Valley and their drug binges. Is that what the red room is? Some sort of crash out den for these overpaid junkies?`,

const Sound = (() => {
  let ctx = null, master = null, comp = null, noiseBuf = null, muted = false;
  let n = {};

  function distCurve(k) {
    const len = 1024, c = new Float32Array(len);
    for (let i = 0; i < len; i++) {
      const x = i * 2 / len - 1;
      c[i] = (3 + k) * x * 20 * Math.PI / 180 / (Math.PI + k * Math.abs(x));
    }
    return c;
  }
  function tone(freq, t0, dur, vol, type) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    comp = ctx.createDynamicsCompressor();
    master = ctx.createGain();
    master.gain.value = muted ? 0 : 0.9;
    master.connect(comp); comp.connect(ctx.destination);

    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

    // drone: detuned saws through a slowly moving low-pass
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 320; lp.Q.value = 3;
    const droneGain = ctx.createGain(); droneGain.gain.value = 0;
    lp.connect(droneGain); droneGain.connect(master);
    [[82.41, 'sawtooth', 0.25], [83.1, 'sawtooth', 0.25], [123.47, 'triangle', 0.22], [165.0, 'sawtooth', 0.12], [41.2, 'sine', 0.9]].forEach(([f, t, v]) => {
      const o = ctx.createOscillator(); o.type = t; o.frequency.value = f;
      const g = ctx.createGain(); g.gain.value = v;
      o.connect(g); g.connect(lp); o.start();
    });
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.07;
    const lfoG = ctx.createGain(); lfoG.gain.value = 120;
    lfo.connect(lfoG); lfoG.connect(lp.frequency); lfo.start();

    // dissonance layer (tritone, minor second, high wrongness) - fades in with story level
    const dis = ctx.createGain(); dis.gain.value = 0; dis.connect(master);
    [116.5, 87.3, 466.2].forEach(f => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const g = ctx.createGain(); g.gain.value = 0.5;
      o.connect(g); g.connect(dis); o.start();
    });

    // hiss
    const hiss = ctx.createBufferSource(); hiss.buffer = noiseBuf; hiss.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 5200; bp.Q.value = 0.6;
    const hissG = ctx.createGain(); hissG.gain.value = 0;
    hiss.connect(bp); bp.connect(hissG); hissG.connect(master); hiss.start();

    n = { lp, droneGain, dis, hissG };
  }

  function setLevel(l) {
    if (!ctx) return;
    const t = ctx.currentTime;
    n.droneGain.gain.setTargetAtTime(0.07 + 0.1 * l, t, 2);
    n.lp.frequency.setTargetAtTime(320 + l * 700, t, 2);
    n.dis.gain.setTargetAtTime(l * l * 0.06, t, 2);
    n.hissG.gain.setTargetAtTime(l * 0.02, t, 2);
  }
  function fadeOut(ms) {
    if (!ctx) return;
    const t = ctx.currentTime, tc = ms / 3000;
    n.droneGain.gain.setTargetAtTime(0, t, tc);
    n.dis.gain.setTargetAtTime(0, t, tc);
    n.hissG.gain.setTargetAtTime(0, t, tc);
  }
  function ping() {
    if (!ctx) return;
    const t = ctx.currentTime;
    tone(659.25, t, 0.5, 0.25);
    tone(987.77, t + 0.14, 0.9, 0.22);
    tone(1046.5, t + 0.14, 0.9, 0.05, 'triangle');
  }
  function deadPing() {
    if (!ctx) return;
    const t = ctx.currentTime;
    tone(220, t, 3, 0.3);
    tone(233.1, t, 3, 0.25);
    tone(110, t + 0.4, 3, 0.2, 'triangle');
  }
  function scratch(v) {
    if (!ctx) return;
    v = v || 0.15;
    const t = ctx.currentTime;
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 4;
    bp.frequency.setValueAtTime(3500, t); bp.frequency.linearRampToValueAtTime(7500, t + 0.5);
    const g = ctx.createGain(); g.gain.setValueAtTime(0, t);
    for (let i = 0; i < 10; i++) {
      g.gain.linearRampToValueAtTime(v * (0.3 + Math.random() * 0.7), t + i * 0.05 + 0.02);
      g.gain.linearRampToValueAtTime(0, t + i * 0.05 + 0.05);
    }
    s.connect(bp); bp.connect(g); g.connect(master);
    s.start(t); s.stop(t + 0.6);
  }
  function thunk() {
    if (!ctx) return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(35, t + 0.5);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.7);
    // power dip
    master.gain.cancelScheduledValues(t);
    master.gain.setValueAtTime(muted ? 0 : 0.9, t);
    master.gain.setValueAtTime(0.15, t + 0.05);
    master.gain.setValueAtTime(muted ? 0 : 0.9, t + 1.0);
  }
  function scream() {
    if (!ctx) return;
    const t = ctx.currentTime;
    master.gain.cancelScheduledValues(t);
    master.gain.setValueAtTime(muted ? 0 : 1, t);
    // noise blast
    const nz = ctx.createBufferSource(); nz.buffer = noiseBuf; nz.loop = true;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 300;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(1, t); ng.gain.exponentialRampToValueAtTime(0.001, t + 1.7);
    nz.connect(hp); hp.connect(ng); ng.connect(master); nz.start(t); nz.stop(t + 1.8);
    // shriek
    const o = ctx.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(400, t);
    o.frequency.exponentialRampToValueAtTime(1400, t + 0.25);
    o.frequency.exponentialRampToValueAtTime(700, t + 1.6);
    const l = ctx.createOscillator(); l.frequency.value = 38;
    const lg = ctx.createGain(); lg.gain.value = 260;
    l.connect(lg); lg.connect(o.frequency);
    const sh = ctx.createWaveShaper(); sh.curve = distCurve(60);
    const og = ctx.createGain();
    og.gain.setValueAtTime(0.6, t); og.gain.exponentialRampToValueAtTime(0.001, t + 1.7);
    o.connect(sh); sh.connect(og); og.connect(master);
    o.start(t); l.start(t); o.stop(t + 1.8); l.stop(t + 1.8);
    // slam
    const b = ctx.createOscillator(); b.type = 'sine';
    b.frequency.setValueAtTime(120, t); b.frequency.exponentialRampToValueAtTime(30, t + 0.6);
    const bg = ctx.createGain();
    bg.gain.setValueAtTime(1, t); bg.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
    b.connect(bg); bg.connect(master); b.start(t); b.stop(t + 0.9);
  }
  function setMuted(m) {
    muted = m;
    if (ctx) master.gain.setTargetAtTime(m ? 0 : 0.9, ctx.currentTime, 0.05);
  }
  function suspend(s) {
    if (!ctx) return;
    if (s) ctx.suspend(); else ctx.resume();
  }
  return { init, setLevel, fadeOut, ping, deadPing, scratch, thunk, scream, setMuted, suspend, isMuted: () => muted };
})();

const S = { delivered: 0, opened: new Set(), files: new Set(), current: -1, waiting: false, ev: new Set(), finalStarted: false, scared: false };
let level = 0.05;
let toastTimer = null, toastIdx = -1;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function renderList() {
  const list = $('#list');
  list.innerHTML = '';
  for (let i = S.delivered - 1; i >= 0; i--) {
    const e = EMAILS[i];
    const row = el('button', 'row' + (S.opened.has(i) ? '' : ' unread') + (S.current === i ? ' sel' : '') + (i === EMAILS.length - 1 ? ' last' : ''));
    row.appendChild(el('span', 'dot'));
    row.appendChild(el('span', 'subj', e.subject));
    row.appendChild(el('span', 'meta', e.short));
    if (e.files.length) row.appendChild(el('span', 'clip', e.files.length + ' file' + (e.files.length > 1 ? 's' : '')));
    row.addEventListener('click', () => openEmail(i));
    list.appendChild(row);
  }
  if (S.delivered < EMAILS.length) list.appendChild(el('div', 'wait', 'Checking for new messages'));
}

function updateBar() {
  const idx = S.delivered - 1;
  if (idx < 0) return;
  $('#stamp').textContent = EMAILS[idx].short;
  const un = S.delivered - S.opened.size;
  $('#unread').textContent = un + ' unread';
  const st = $('#status');
  let txt = 'Clearance: green', alert = false;
  if (idx >= 13) { txt = 'Signal: lost'; alert = true; }
  else if (idx >= 10) { txt = 'Power: unstable'; alert = true; }
  else if (idx >= 8) { txt = 'Red sections: lockdown'; alert = true; }
  st.textContent = txt;
  st.className = alert ? 'alert' : '';
}

function renderFiles(i) {
  const box = $('#rfiles');
  box.innerHTML = '';
  EMAILS[i].files.forEach((f, k) => {
    const done = S.files.has(i + ':' + k);
    const b = el('button', 'file' + (done ? ' done' : ''));
    b.appendChild(el('span', '', f.name));
    b.appendChild(el('span', 'tag', done ? 'opened' : 'new'));
    b.addEventListener('click', () => openFile(i, k));
    box.appendChild(b);
  });
}

function openEmail(i) {
  S.current = i;
  S.opened.add(i);
  const e = EMAILS[i];
  $('#rempty').hidden = true;
  $('#rview').hidden = false;
  $('#rsubj').textContent = e.subject;
  $('#rfrom').textContent = e.from || '[unlisted sender]';
  $('#rdate').textContent = e.date;
  const b = $('#rbody');
  b.textContent = e.body;
  b.className = 'rbody' + (e.final ? ' hunger' : '');
  renderFiles(i);
  $('#bodywrap').classList.add('show-reader');
  $('#doc').hidden = true;
  $('#rscroll').scrollTop = 0;
  renderList(); updateBar();
  if (e.event === 'blackout' && !S.ev.has(i)) { S.ev.add(i); setTimeout(blackout, 700); }
  if (e.final) startFinal();
  checkProgress();
}

function openFile(i, k) {
  const f = EMAILS[i].files[k];
  $('#dname').textContent = f.name;
  $('#dtitle').textContent = f.title;
  $('#ddate').textContent = f.date || '';
  $('#dbody').textContent = f.body;
  $('#doc').hidden = false;
  $('#dscroll').scrollTop = 0;
  S.files.add(i + ':' + k);
  renderFiles(i);
  checkProgress();
}

function consumed(i) {
  return S.opened.has(i) && EMAILS[i].files.every((_, k) => S.files.has(i + ':' + k));
}

function checkProgress() {
  if (S.waiting || S.delivered >= EMAILS.length) return;
  if (consumed(S.delivered - 1)) {
    S.waiting = true;
    setTimeout(() => { S.waiting = false; deliverNext(); }, rand(4500, 8000));
  }
}

function deliverNext() {
  if (S.delivered >= EMAILS.length) return;
  const i = S.delivered;
  S.delivered++;
  const e = EMAILS[i];
  level = e.level;
  Sound.setLevel(level);
  if (e.final) Sound.deadPing(); else Sound.ping();
  renderList(); updateBar(); showToast(i);
}

function showToast(i) {
  toastIdx = i;
  $('#toasttext').textContent = EMAILS[i].subject;
  $('#toast').hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('#toast').hidden = true; }, 5000);
}

  c.quadraticCurveTo(0, -ry * 2, rx, 0);

  c.closePath();
  c.fillStyle = '#e6dfd0'; c.fill();
  c.lineWidth = Math.max(2, rx * 0.06); c.strokeStyle = '#120a08'; c.stroke();

  c.strokeStyle = 'rgba(170,30,30,.55)'; c.lineWidth = Math.max(1, rx * 0.02);
  for (let i = 0; i < 8; i++) {

    c.beginPath();

  const ix = look.x * rx * 0.25, iy = look.y * ry * 0.2;

}

    c.beginPath();
    c.moveTo(s * S0 * 0.16, -S0 * 0.5);
    c.bezierCurveTo(s * S0 * 0.3 + wob, -S0 * 0.85, s * S0 * 0.15, -S0 * 1.0, s * S0 * 0.45 + wob, -S0 * 1.25);
    c.stroke();
  }

  // head
  c.beginPath(); c.ellipse(0, S0 * 0.05, S0 * 0.5, S0 * 0.62, 0, 0, Math.PI * 2);
  const hg = c.createRadialGradient(-S0 * 0.1, -S0 * 0.2, S0 * 0.05, 0, 0, S0 * 0.7);
  hg.addColorStop(0, '#2b211d'); hg.addColorStop(0.6, '#0d0a0a'); hg.addColorStop(1, '#000');
  c.fillStyle = hg; c.fill();
  c.lineWidth = S0 * 0.01; c.strokeStyle = '#3a2a22'; c.stroke();
  c.strokeStyle = 'rgba(90,70,60,.4)'; c.lineWidth = S0 * 0.006;
  for (let k = 0; k < 3; k++) {
    c.beginPath();
    c.ellipse(0, S0 * 0.05, S0 * (0.42 - k * 0.07), S0 * (0.54 - k * 0.09), 0, Math.PI * 1.1, Math.PI * 1.9);
    c.stroke();
  }

  // mandibles with human teeth
  const open = 0.5 + 0.5 * Math.sin(t / 55);
  for (const s of [-1, 1]) {
    c.save(); c.scale(s, 1);
    const ox = S0 * 0.06 * open;
    c.beginPath();
    c.moveTo(S0 * 0.16 + ox, S0 * 0.5);
    c.bezierCurveTo(S0 * 0.5 + ox, S0 * 0.6, S0 * 0.45 + ox, S0 * 0.98, S0 * 0.06 + ox * 0.5, S0 * 0.92);
    c.bezierCurveTo(S0 * 0.3 + ox, S0 * 0.85, S0 * 0.3 + ox, S0 * 0.66, S0 * 0.16 + ox, S0 * 0.5);
    c.closePath();
    c.fillStyle = '#3a170f'; c.fill();
    c.strokeStyle = '#8a4a34'; c.lineWidth = S0 * 0.008; c.stroke();
    c.fillStyle = '#d8cfc0';
    for (let k = 0; k < 6; k++) {
      const tx = S0 * (0.1 + k * 0.045) + ox * 0.6, ty = S0 * (0.9 - k * 0.02);
      c.fillRect(tx, ty - S0 * 0.06, S0 * 0.028, S0 * 0.06);
    }
    c.restore();
  }

  // eyes: two large human eyes, three small ones on the forehead
  const look = { x: Math.sin(t / 90) * 0.6, y: 0.3 };
  const dil = Math.min(1, p * 1.5);
  humanEye(c, -S0 * 0.22, S0 * 0.02, S0 * 0.17, S0 * 0.09, look, dil);
  humanEye(c, S0 * 0.22, S0 * 0.02, S0 * 0.17, S0 * 0.09, look, dil);
  humanEye(c, -S0 * 0.09, -S0 * 0.25, S0 * 0.06, S0 * 0.035, look, dil);
  humanEye(c, S0 * 0.09, -S0 * 0.25, S0 * 0.06, S0 * 0.035, look, dil);
  humanEye(c, 0, -S0 * 0.34, S0 * 0.06, S0 * 0.035, look, dil);

  c.setTransform(1, 0, 0, 1, 0, 0);
  if (p > 0.45) {
    c.fillStyle = 'rgba(200,30,20,' + (0.15 + Math.random() * 0.25) + ')';
    c.font = Math.floor(w * 0.28) + 'px VT323, monospace';
    c.textAlign = 'center';
    c.fillText('HUNGER', w / 2 + (Math.random() - 0.5) * 30, h * (0.3 + Math.random() * 0.5));
  }
  if (!reduce) {
    for (let k = 0; k < 7; k++) {
      const y = Math.random() * h, hh = 8 + Math.random() * 60, dx = (Math.random() - 0.5) * 90;
      c.drawImage(c.canvas, 0, y, w, hh, dx, y, w, hh);
    }
    if ((t > 500 && t < 540) || (t > 1000 && t < 1040)) {
      c.globalCompositeOperation = 'difference'; c.fillStyle = '#fff'; c.fillRect(0, 0, w, h);
      c.globalCompositeOperation = 'source-over';
    }
  }
}

function scare() {
  if (S.scared) return;
  S.scared = true;
  const cv = $('#scare'), c = cv.getContext('2d');
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  cv.style.display = 'block';
  Sound.scream();
  const DUR = 1700, start = performance.now();
  (function frame(now) {
    const t = now - start;
    if (t >= DUR) { finishScare(); return; }
    drawFace(c, cv.width, cv.height, t / DUR, t);
    requestAnimationFrame(frame);
  })(start);
}

function finishScare() {
  const cv = $('#scare');
  cv.getContext('2d').clearRect(0, 0, cv.width, cv.height);
  Sound.fadeOut(300);
  $('#crt').style.visibility = 'hidden';
  const end = $('#end');
  end.style.display = 'flex';
  setTimeout(() => cv.style.display = 'none', 50);
  setTimeout(() => $('#endline').classList.add('on'), 2200);
  setTimeout(() => $('#card').classList.add('on'), 4200);
}

$('#card').addEventListener('click', () => {
  const card = $('#card');
  if (card.classList.contains('flip')) return;
  card.classList.add('flip');
  setTimeout(() => $('#after').classList.add('on'), 1400);
  setTimeout(() => $('#again').classList.add('on'), 3600);
});
$('#again').addEventListener('click', () => location.reload());

/* ------------------------------ boot ------------------------------- */

function runBoot() {
  $('#bootgate').hidden = true;
  const log = $('#bootlog');
  log.hidden = false;
  const lines = [
    'Checking memory .............. ok',
    'Mounting glass substrate ..... ok',
    'Reading badge ................ ok',
    'User: ' + USER_NAME,
    'Clearance: green',
    ['Red sections: no access', 'warnline']
  ];
  let k = 0;
  (function next() {
    if (k < lines.length) {
      const L = lines[k++];
      log.appendChild(el('div', Array.isArray(L) ? L[1] : '', Array.isArray(L) ? L[0] : L));
      setTimeout(next, rand(260, 520));
    } else {
      setTimeout(showMail, 1000);
    }
  })();
}

function showMail() {
  $('#boot').style.display = 'none';
  $('#mail').style.display = 'flex';
  renderList();
  setTimeout(deliverNext, 2200);
  setTimeout(glitchTick, 4000);
  setTimeout(antTick, 20000);
}

$('#login').addEventListener('click', () => {
  Sound.init();
  Sound.setLevel(level);
  runBoot();
});
$('#back').addEventListener('click', () => $('#bodywrap').classList.remove('show-reader'));
$('#dclose').addEventListener('click', () => { $('#doc').hidden = true; });
$('#toast').addEventListener('click', () => { $('#toast').hidden = true; openEmail(toastIdx); });
$('#mute').addEventListener('click', () => {
  Sound.setMuted(!Sound.isMuted());
  $('#mute').textContent = Sound.isMuted() ? 'Sound off' : 'Sound on';
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#doc').hidden = true; });
document.addEventListener('visibilitychange', () => Sound.suspend(document.hidden));

})();
